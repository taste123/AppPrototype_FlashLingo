<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="24" fill="#7FB6D8"/>
  <!-- Body -->
  <rect x="70" y="100" width="60" height="55" rx="8" fill="#fff"/>
  <!-- Head -->
  <circle cx="100" cy="75" r="30" fill="#fff"/>
  <!-- Hair -->
  <path d="M70,72 Q72,40 100,40 Q128,40 130,72" fill="#5C3D2E"/>
  <!-- Eyes -->
  <circle cx="89" cy="74" r="3.5" fill="#333"/>
  <circle cx="111" cy="74" r="3.5" fill="#333"/>
  <!-- Smile -->
  <path d="M90,86 Q100,95 110,86" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Glasses -->
  <circle cx="89" cy="74" r="8" fill="none" stroke="#E76F51" stroke-width="2"/>
  <circle cx="111" cy="74" r="8" fill="none" stroke="#E76F51" stroke-width="2"/>
  <line x1="97" y1="74" x2="103" y2="74" stroke="#E76F51" stroke-width="2"/>
  <!-- Pointer stick -->
  <line x1="135" y1="90" x2="170" y2="55" stroke="#5C3D2E" stroke-width="4" stroke-linecap="round"/>
  <!-- Arm holding pointer -->
  <path d="M125,110 Q140,100 140,95" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Blackboard -->
  <rect x="25" y="25" width="50" height="35" rx="3" fill="#264653"/>
  <text x="38" y="48" font-family="Arial,sans-serif" font-size="14" font-weight="900" fill="#fff">ABC</text>
</svg>
