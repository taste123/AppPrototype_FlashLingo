<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="24" fill="#7FB6D8"/>
  <!-- Table top -->
  <rect x="30" y="70" width="140" height="18" rx="4" fill="#fff"/>
  <!-- Table legs -->
  <rect x="50" y="88" width="10" height="70" rx="2" fill="#fff" opacity="0.85"/>
  <rect x="140" y="88" width="10" height="70" rx="2" fill="#fff" opacity="0.85"/>
  <!-- Book on table -->
  <rect x="70" y="45" width="30" height="25" rx="2" fill="#E76F51"/>
  <line x1="85" y1="45" x2="85" y2="70" stroke="#fff" stroke-width="1.5"/>
  <!-- Pencil -->
  <rect x="120" y="50" width="6" height="20" rx="1" fill="#F4A261" transform="rotate(-15,123,60)"/>
  <polygon points="120,70 126,70 123,78" fill="#333" transform="rotate(-15,123,60)"/>
</svg>
