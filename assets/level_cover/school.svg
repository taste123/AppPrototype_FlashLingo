  <line x1="40" y1="120" x2="40" y2="130" stroke="#7FB6D8" stroke-width="1.5"/>
  <line x1="55" y1="120" x2="55" y2="133" stroke="#7FB6D8" stroke-width="1.5"/>
  <line x1="70" y1="120" x2="70" y2="130" stroke="#7FB6D8" stroke-width="1.5"/>
  <line x1="85" y1="120" x2="85" y2="133" stroke="#7FB6D8" stroke-width="1.5"/>
  <line x1="100" y1="120" x2="100" y2="130" stroke="#7FB6D8" stroke-width="1.5"/>
  <!-- Apple -->
  <circle cx="150" cy="145" r="20" fill="#E76F51"/>
  <path d="M150,125 Q155,115 160,120" stroke="#4ADE80" stroke-width="3" fill="none"/>
  <ellipse cx="156" cy="120" rx="6" ry="3" fill="#4ADE80" transform="rotate(-20,156,120)"/>
