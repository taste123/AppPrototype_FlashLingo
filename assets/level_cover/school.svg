<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="24" fill="#7FB6D8"/>
  <!-- Book -->
  <rect x="25" y="50" width="60" height="45" rx="4" fill="#fff" stroke="#fff" stroke-width="2"/>
  <line x1="55" y1="50" x2="55" y2="95" stroke="#7FB6D8" stroke-width="2"/>
  <line x1="32" y1="62" x2="50" y2="62" stroke="#ccc" stroke-width="2"/>
  <line x1="32" y1="72" x2="50" y2="72" stroke="#ccc" stroke-width="2"/>
  <line x1="32" y1="82" x2="45" y2="82" stroke="#ccc" stroke-width="2"/>
  <line x1="60" y1="62" x2="78" y2="62" stroke="#ccc" stroke-width="2"/>
  <line x1="60" y1="72" x2="78" y2="72" stroke="#ccc" stroke-width="2"/>
  <line x1="60" y1="82" x2="73" y2="82" stroke="#ccc" stroke-width="2"/>
  <!-- Pencil -->
  <rect x="115" y="40" width="12" height="70" rx="2" fill="#F4A261" transform="rotate(15,121,75)"/>
