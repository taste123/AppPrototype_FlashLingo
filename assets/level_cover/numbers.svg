<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="24" fill="#F4A261"/>
  <!-- Row 1 -->
  <text x="40" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">1</text>
  <text x="90" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">2</text>
  <text x="140" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">3</text>
  <!-- Row 2 -->
  <text x="40" y="115" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">4</text>
  <text x="90" y="115" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">5</text>
  <text x="140" y="115" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">6</text>
  <!-- Row 3 -->
  <text x="40" y="165" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">7</text>
  <text x="90" y="165" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">8</text>
  <text x="140" y="165" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">9</text>
  <!-- Plus sign accent -->
  <text x="172" y="55" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#e76f51" opacity="0.5">+</text>
  <text x="172" y="165" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#e76f51" opacity="0.5">=</text>
</svg>
